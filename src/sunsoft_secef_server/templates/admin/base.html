<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ title }} — Sunsoft SECeF</title>
    <link rel="stylesheet" href="{{ request.url_for('admin-static', path='admin/admin.css') }}?v=20261002-3">
    {% block page_styles %}{% endblock %}
</head>
<body class="admin-body">
<div class="shell">
    <aside class="sidebar" id="admin-sidebar" aria-label="Navigation principale">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">S</div>
            <div class="brand-copy">
                <div class="brand-name">Sunsoft SECeF</div>
                <div class="brand-sub">Administration</div>
            </div>
            <button class="sidebar-close" type="button" hidden aria-label="Fermer le menu" title="Fermer le menu">
                <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
        </div>

        <nav class="nav" id="primary-navigation" aria-label="Menu d’administration">
            <a href="{{ request.url_for('admin-dashboard') }}" class="{% if request.url.path == request.url_for('admin-dashboard').path %}is-active{% endif %}">
                <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg>
                <div class="nav-label">Tableau de bord</div>
            </a>
            <a href="{{ request.url_for('admin-clients') }}" class="{% if request.url.path == request.url_for('admin-clients').path %}is-active{% endif %}">
                <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.4-3.2 2.4-5 5.5-5s5.1 1.8 5.5 5M16 5.3a3.2 3.2 0 0 1 0 6.2M17 15c2.1.5 3.3 2.1 3.5 5"/></svg>
                <div class="nav-label">Clients</div>
            </a>
            <a href="{{ request.url_for('admin-odoo') }}" class="{% if request.url.path == request.url_for('admin-odoo').path %}is-active{% endif %}">
                <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2m4 0h2M8 11h2m4 0h2M9 21v-5h6v5"/></svg>
                <div class="nav-label">Odoo</div>
            </a>
            <a href="{{ request.url_for('admin-sites') }}" class="{% if request.url.path == request.url_for('admin-sites').path %}is-active{% endif %}">
                <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/></svg>
                <div class="nav-label">Sites</div>
            </a>
            <a href="{{ request.url_for('admin-agents') }}" class="{% if request.url.path.startswith(request.url_for('admin-agents').path) %}is-active{% endif %}">
                <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M7 8h10"/></svg>
                <div class="nav-label">Agents</div>
            </a>
            <a href="{{ request.url_for('admin-activations') }}" class="{% if request.url.path == request.url_for('admin-activations').path %}is-active{% endif %}">
                <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13h6l-.5 9L19 11h-6l.5-9Z"/></svg>
                <div class="nav-label">Activations</div>
            </a>
            <a href="{{ request.url_for('admin-agent-windows') }}" class="{% if request.url.path == request.url_for('admin-agent-windows').path %}is-active{% endif %}">
                <svg class="nav-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.8"/><path d="M2 20h20m-8-4 1 4m-6-4-1 4"/><path d="m10 8 2 2 2-2"/></svg>
                <div class="nav-label">Agent Windows</div>
            </a>
        </nav>

        <form action="{{ request.url_for('admin-logout') }}" method="post" class="logout-form">
            <button type="submit"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M15 16l4-4-4-4m4 4H9"/></svg><span>Déconnexion</span></button>
        </form>
    </aside>

    <button class="sidebar-backdrop" type="button" hidden aria-label="Fermer le menu"></button>

    <main class="main">
        <header class="topbar">
            <div class="topbar-title-group">
                <button class="sidebar-toggle" type="button" hidden aria-label="Ouvrir le menu" aria-controls="admin-sidebar" aria-expanded="false" title="Ouvrir le menu">
                    <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <div><h1>{{ title }}</h1></div>
            </div>
            <div class="account">
                <div class="account-dot"></div>
                <div><strong>{{ admin_username }}</strong><span>Administrateur</span></div>
            </div>
        </header>
        <section class="content">
            {% block content %}{% endblock %}
        </section>
    </main>
</div>
<script>
(() => {
    const shell = document.querySelector('.shell');
    const openButton = document.querySelector('.sidebar-toggle');
    const closeButton = document.querySelector('.sidebar-close');
    const backdrop = document.querySelector('.sidebar-backdrop');
    const nav = document.querySelector('.nav');
    const mobileMenu = window.matchMedia('(max-width: 780px)');
    if (!shell || !openButton) return;
    const syncControls = () => {
        openButton.hidden = !mobileMenu.matches;
        if (closeButton) closeButton.hidden = !mobileMenu.matches;
    };
    syncControls();
    mobileMenu.addEventListener('change', syncControls);
    const setMenuOpen = (open) => {
        shell.classList.toggle('sidebar-open', open);
        document.body.classList.toggle('sidebar-lock', open);
        if (backdrop) backdrop.hidden = !open;
        openButton.setAttribute('aria-expanded', String(open));
    };
    openButton.addEventListener('click', () => setMenuOpen(true));
    closeButton?.addEventListener('click', () => setMenuOpen(false));
    backdrop?.addEventListener('click', () => setMenuOpen(false));
    nav?.addEventListener('click', (event) => {
        if (event.target.closest('a')) setMenuOpen(false);
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') setMenuOpen(false);
    });
})();
</script>
</body>
</html>
