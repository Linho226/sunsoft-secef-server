{% extends "admin/base.html" %}

{% block content %}

<div class="page-intro">
    <p>{{ description }}</p>
</div>

<section class="panel table-panel">

    {% if rows %}

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    {% for column in columns %}
                    <th>{{ column }}</th>
                    {% endfor %}
                </tr>
            </thead>

            <tbody>

                {% for row in rows %}

                <tr>
                    {% for value in row %}
                    <td>{{ value }}</td>
                    {% endfor %}
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

    {% else %}

    <div class="empty-state large">
        {{ empty_message }}
    </div>

    {% endif %}

</section>

{% endblock %}
