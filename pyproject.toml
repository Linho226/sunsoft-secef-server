[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sunsoft-secef-server"
version = "0.1.0"
description = "Plateforme centrale Sunsoft SECeF"
authors = [
    { name = "Alain GANSONRE" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "itsdangerous>=2.2,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sunsoft_secef_server = [
    "templates/**/*.html",
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]